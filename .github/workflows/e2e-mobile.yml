name: E2E mobile (Sprint 3, manual)

# Opt-in: SOLO workflow_dispatch. No se ejecuta en push ni en pull_request, así que ningún PR normal depende de
# infraestructura E2E. Requiere un ambiente de PRUEBA real (backend, Clerk test, PostgreSQL, R2) y el Environment
# `e2e-mobile` con los secrets listados en docs/quality/s3-mobile-e2e.md. Sin ellos el preflight FALLA: nunca se simula un PASS.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-mobile
  cancel-in-progress: false

jobs:
  e2e-mobile:
    name: Playwright mobile-chromium (ambiente real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e-mobile
    env:
      # Públicas (variables del repositorio/Environment, no secrets).
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      E2E_TENANT_ID: ${{ vars.E2E_TENANT_ID }}
      E2E_TENANT_B_ID: ${{ vars.E2E_TENANT_B_ID }}
      E2E_TENANT_B_RECEPTION_ID: ${{ vars.E2E_TENANT_B_RECEPTION_ID }}
      # Privadas del runner (secrets del Environment).
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_RESTRICTED_EMAIL: ${{ secrets.E2E_RESTRICTED_EMAIL }}
      E2E_RESTRICTED_PASSWORD: ${{ secrets.E2E_RESTRICTED_PASSWORD }}
      E2E_TENANT_B_USER_EMAIL: ${{ secrets.E2E_TENANT_B_USER_EMAIL }}
      E2E_TENANT_B_USER_PASSWORD: ${{ secrets.E2E_TENANT_B_USER_PASSWORD }}
      E2E_TENANT_B_SENTINEL: ${{ secrets.E2E_TENANT_B_SENTINEL }}
      E2E_VERIFICATION_CODE: ${{ secrets.E2E_VERIFICATION_CODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run mobile E2E gate (real environment)
        run: npm run e2e:mobile

      - name: Job summary (sanitized evidence only)
        if: always()
        run: |
          {
            echo "### E2E mobile — commit ${GITHUB_SHA}"
            echo "Run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}. El estado del job es el resultado del gate; no se suben traces, capturas ni reportes (pueden contener sesión/PII)."
            for file in test-results/*/s3-signature-r2-evidence.json; do
              [ -f "$file" ] && { echo '```json'; cat "$file"; echo '```'; }
            done
          } >> "$GITHUB_STEP_SUMMARY"
