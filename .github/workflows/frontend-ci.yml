name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for secret scanning)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Show toolchain versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Pruebas del propio harness E2E (credential-free): sin Clerk, backend, R2 ni secretos. Lanzan Chromium contra un
      # formulario local, así que necesitan el navegador; el E2E real (con secretos) vive en e2e-mobile.yml, manual.
      - name: Install Chromium for the E2E harness tests
        run: npx playwright install --with-deps chromium

      - name: E2E harness tests (no credentials)
        run: npm run test:e2e:harness

      - name: Build
        run: npm run build

      - name: Dependency scan (critical vulnerabilities block)
        run: npm audit --audit-level=critical

      - name: Secret scan (gitleaks, full history)
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
      
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
      
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .
          rm -f gitleaks gitleaks.tar.gz
